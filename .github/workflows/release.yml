name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    secrets: inherit

  create-version:
    uses: platform-mesh/.github/.github/workflows/job-create-version.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    secrets: inherit

  docker-build-push:
    needs: [create-version, test]
    uses: platform-mesh/.github/.github/workflows/job-docker-build-push.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    with:
      imageTagName: ghcr.io/platform-mesh/marketplace-ui
      version: ${{ needs.create-version.outputs.version }}
      multiarch: true
    secrets: inherit

  update-version:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-chart-version-update.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    secrets: inherit
    with:
      appVersion: ${{ needs.create-version.outputs.version }}
      chart: marketplace-ui
      targetRepository: platform-mesh/platform-mesh

  sbom:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    with:
      imageReference: ghcr.io/platform-mesh/marketplace-ui:${{ needs.create-version.outputs.version }}

  image-ocm:
    needs: [create-version, docker-build-push, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # no repository writes needed
      packages: write # push OCM component to ghcr.io
      id-token: write # keyless OCM signing
    steps:
      - uses: platform-mesh/.github/.github/actions/image-ocm@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
        with:
          imageReference: ghcr.io/platform-mesh/marketplace-ui:${{ needs.create-version.outputs.version }}
          appVersion: ${{ needs.create-version.outputs.version }}
          repoName: marketplace-ui
          commit: ${{ github.sha }}

  scan-sbom:
    needs: [create-version, docker-build-push, sbom, image-ocm]
    uses: platform-mesh/.github/.github/workflows/job-trivy-sbom.yml@15b291d550257bc590a89917bfbbe0e30bf08895 # main # zizmor: ignore[stale-action-refs]
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      componentVersion: ${{ needs.create-version.outputs.version }}
