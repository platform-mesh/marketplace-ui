@let verificationInfoData = verificationInfo();
@if (verificationInfoData) {
  <div>
    <span
      class="verification-label"
      fd-object-status
      [glyph]="verificationInfoData.icon || 'verified'"
      [label]="verificationInfoData.label"
      [status]="verificationInfoData.status || 'informative'"
      [fd-inline-help]="verificationInfoData.hint || ''"
    ></span>
  </div>
}
