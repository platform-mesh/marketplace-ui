version: '3'

vars:
  KIND_CLUSTER: '{{.KIND_CLUSTER | default "platform-mesh"}}'
  NAMESPACE: platform-mesh-system
  DEPLOYMENT: marketplace-ui
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the application
    cmds:
      - npm run build

  docker:build:
    desc: Build Docker image with specified tag
    cmds:
      - '{{.CONTAINER_RUNTIME}} build --secret id=common_repository_token,src=.secret/common-repo -t {{.IMAGE_NAME}} .'
    vars:
      IMAGE_NAME: ghcr.io/platform-mesh/marketplace-ui:{{.IMAGE_TAG | default "dev"}}

  docker:kind:
    desc: Build container image with current tag from kind cluster and load it
    vars:
      IMAGE_TAG:
        sh: kubectl get deployment {{.DEPLOYMENT}} -n {{.NAMESPACE}} -o jsonpath='{.spec.template.spec.containers[0].image}' | cut -d':' -f2
      IMAGE_NAME: ghcr.io/platform-mesh/marketplace-ui:{{.IMAGE_TAG}}
    cmds:
      - echo "Building image with tag {{.IMAGE_TAG}} using {{.CONTAINER_RUNTIME}}"
      - '{{.CONTAINER_RUNTIME}} build --secret id=common_repository_token,src=.secret/common-repo -t {{.IMAGE_NAME}} .'
      - |
        if [ "{{.CONTAINER_RUNTIME}}" = "podman" ]; then
          {{.CONTAINER_RUNTIME}} save {{.IMAGE_NAME}} -o /tmp/kind-image.tar
          kind load image-archive /tmp/kind-image.tar --name {{.KIND_CLUSTER}}
          rm -f /tmp/kind-image.tar
        else
          kind load docker-image {{.IMAGE_NAME}} --name {{.KIND_CLUSTER}}
        fi
      - kubectl rollout restart deployment/{{.DEPLOYMENT}} -n {{.NAMESPACE}}
      - kubectl rollout status deployment/{{.DEPLOYMENT}} -n {{.NAMESPACE}} --timeout=120s
      - echo "Image loaded and deployment restarted"

  install:
    desc: Install dependencies
    cmds:
      - COMMON_REPOSITORY_TOKEN=$(cat .secret/common-repo) npm ci

  test:
    desc: Run tests
    cmds:
      - npm run test:unit

  test:cov:
    desc: Run tests with coverage
    cmds:
      - npm run test:cov

  lint:
    desc: Run linter
    cmds:
      - npm run lint

  lint:fix:
    desc: Run linter with auto-fix
    cmds:
      - npm run lint:fix
